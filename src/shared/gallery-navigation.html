<header id="site-header" class="gallery-navigation">
  <div class="gallery-navigation__top">
    <a class="gallery-navigation__brand" href="{{site-root}}">Motion &amp; UI</a>
    <nav class="gallery-navigation__pages" aria-label="UI Gallery と既存の UI studies">
      <a href="{{gallery-root}}" data-gallery-page="index">UI Gallery</a>
      <a href="{{gallery-root}}form/" data-gallery-page="form" data-no-swup>Form</a>
      <a href="{{gallery-root}}tooltip-behavior/" data-gallery-page="tooltip-behavior" data-no-swup>Tooltips</a>
      <a href="{{gallery-root}}typography/" data-gallery-page="typography" data-no-swup>Typography</a>
      <a href="{{gallery-root}}mega-menu/" data-gallery-page="mega-menu" data-no-swup>Mega Menu</a>
      <a href="{{site-root}}motion-archive/">Motion Archive</a>
    </nav>
  </div>
  <div class="gallery-navigation__references">
    <p class="gallery-navigation__label">Motion references <span>{{reference-total}} studies</span></p>
    <nav class="gallery-navigation__categories" aria-label="Motion reference categories" data-gallery-categories>
      <a href="{{gallery-root}}buttons/" data-gallery-category="buttons" data-no-swup>Buttons <span data-gallery-count="buttons">{{buttons-count}}</span></a>
      <a href="{{gallery-root}}sliders/" data-gallery-category="sliders">Sliders <span data-gallery-count="sliders">{{sliders-count}}</span></a>
      <a href="{{gallery-root}}section-transitions/" data-gallery-category="section-transitions">Section transitions <span data-gallery-count="section-transitions">{{section-transitions-count}}</span></a>
      <a href="{{gallery-root}}text-reveals/" data-gallery-category="text-reveals">Text motion <span data-gallery-count="text-reveals">{{text-reveals-count}}</span></a>
      <a href="{{gallery-root}}image-reveals/" data-gallery-category="image-reveals">Image reveals <span data-gallery-count="image-reveals">{{image-reveals-count}}</span></a>
    </nav>
  </div>
</header>
