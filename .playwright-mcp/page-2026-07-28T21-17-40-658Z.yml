      - generic:
        - heading [level=1]: Veiled Transition
        - generic: WIP
      - paragraph: 画面の左右で方向が変わるマウスストーカーを操作の入口にして、画像を縦へ引き延ばしながら次のテクスチャへつなぐWebGLスライダー。
      - generic:
        - link:
          - /url: ../../categories/#technique-webgl
          - text: WebGL
        - generic: Shader
        - generic: Cursor
        - link:
          - /url: ../../categories/#expression-image
          - text: Image
      - generic:
        - generic:
          - heading [level=2]: 2枚のテクスチャを受け渡す
          - paragraph:
            - text: 現在画像を
            - code: uFrom
            - text: 、次画像を
            - code: uTo
            - text: へ渡し、
            - code: uProgress
            - text: を0から1まで進める。画像ごとの実寸とCanvas比率を比較してUVをcover補正するため、縦横比の違う素材でも中央のフレームを埋めたまま切り替わる。
        - generic:
          - heading [level=2]: 中央から円形の波を広げる
          - paragraph:
            - text: 各ピクセルのUVと画像中央との距離を求め、
            - code: uProgress
            - text: から作った半径との差をリング状の強度へ変換する。フラグメント側ではリング付近だけUVを放射方向へ押し引きする。ねじれと正弦波は進捗80%までGUIの設定値を保ち、80〜100%で滑らかに0へ戻す。
        - generic:
          - heading [level=2]: 波頭のPlaneを持ち上げる
          - paragraph: 画像Planeを横96、縦128セグメントへ分割し、頂点シェーダーでも切り替え境界と同じリングを計算する。リングの頂点だけをZ方向へ持ち上げ、波が通過した内側はZ=0へ戻す。透視投影にすることで、次画像が中央から現れ、持ち上がった紙の縁が外へ進みながら平面へ接地する奥行きを見せる。
        - generic:
          - heading [level=2]: 歪みの中で画像を切り替える
          - paragraph:
            - text: 波の半径より内側を次画像、外側を現在画像として
            - code: smoothstep
            - text: で混ぜる。切り替え境界とUVを歪ませるリングに同じ半径を使うため、画像が変わる場所と波打つ場所が離れない。完了時は両uniformを確定画像へ揃える。
        - generic:
          - heading [level=2]: ポインター位置を方向へ変換する
          - paragraph:
            - text: ステージ内のポインターX座標を中央と比較し、左側なら前、右側なら次へ進む。円形カーソルは表示座標を補間して追従させ、クリック方向と矢印表示を同じ値から決める。タッチ操作ではスワイプ距離を判定して同じ
            - code: move()
            - text: へ渡す。
