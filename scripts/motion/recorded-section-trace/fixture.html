<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#fff}*{box-sizing:border-box}#root{width:100%}.skip-link{position:absolute;left:-10000px}</style></head><body><div id="root"></div><script type="module">
const slug=new URLSearchParams(location.search).get('slug')||'gradient-frame-wipe';
const style=document.createElement('link');style.rel='stylesheet';style.href=`/ui-gallery/section-transitions/${slug}/style.scss`;document.head.append(style);
const {createDemo}=await import(/* @vite-ignore */ `/ui-gallery/section-transitions/${slug}/demo.js`);
window.mount=async(reduced=false)=>{window.controller?.abort();window.demo?.destroy();window.controller=new AbortController();window.demo=createDemo(document.querySelector('#root'),{signal:controller.signal,reducedMotion:reduced});await demo.ready;return true;};
await window.mount();window.ready=true;
</script></body></html>
